name: Discover learning resources
on:
  schedule:
    # Every Monday; the date gate runs discovery on alternating weeks.
    - cron: '23 13 * * 1'
  workflow_dispatch:
    inputs:
      without_web:
        description: 'Explicit partial test: skip Brave web search'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the fortnightly calendar
        id: calendar
        run: echo "due=$(python scripts/discover.py --gate)" >> "$GITHUB_OUTPUT"
      - name: Search and prepare additions
        if: github.event_name == 'workflow_dispatch' || steps.calendar.outputs.due == 'true'
        id: search
        env:
          GH_TOKEN: ${{ github.token }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          WITHOUT_WEB: ${{ inputs.without_web }}
        run: |
          args=()
          if [ "$WITHOUT_WEB" = "true" ]; then args+=(--without-web); fi
          python scripts/discover.py --apply "${args[@]}"
      - name: Validate the actual proposed catalog
        if: steps.search.outputs.count != '' && steps.search.outputs.count != '0'
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py
      - name: Open a review PR
        if: steps.search.outputs.count != '' && steps.search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="discovery/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json README.md
          git commit -m 'Propose newly discovered learning resources'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Review learning resources — $(date -u +%F)" --body-file work/proposal.md
